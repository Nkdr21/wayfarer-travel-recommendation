<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | Wayfarer</title><style>:root{font:17px/1.55 system-ui,sans-serif;color:#162b28;background:#fbf8ef}*{box-sizing:border-box}body{margin:0}a{color:inherit}.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,4vw,4rem);background:#103c36;color:#fff}.brand{font:700 1.5rem Georgia,serif;text-decoration:none}.topbar nav,.topbar form,.categories{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem 1rem}.topbar nav a{font-size:.9rem;text-underline-offset:.3em}.topbar nav a:not([aria-current]){text-decoration:none}input,button,textarea{font:inherit;border-radius:.45rem;padding:.55rem .75rem;border:1px solid #879b92}button{cursor:pointer;background:#e8bb78;border-color:#e8bb78;color:#182d29;font-weight:700}button:hover{background:#f5cf96}#clear-search{background:transparent;color:white}.hero{padding:clamp(2.5rem,7vw,5rem) clamp(1rem,8vw,8rem);background:linear-gradient(115deg,#123f37,#265d52);color:#fff}.hero h1,.page h1{font:700 clamp(2.8rem,7vw,5.8rem)/1 Georgia,serif;margin:.25em 0}.hero>p:last-child{max-width:38rem}.eyebrow{font-size:.78rem;font-weight:750;letter-spacing:.16em}.hero .eyebrow{color:#f1ca90}.results,.page{width:min(1050px,calc(100% - 2rem));margin:2rem auto 4rem}.page{max-width:720px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,275px),1fr));gap:1.25rem}.card{overflow:hidden;border:1px solid #d4dbd0;border-radius:.8rem;background:#fff}.card img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block}.card div{padding:1rem}.card h3{margin:.1rem 0;font:700 1.5rem Georgia,serif}.card p{margin:.4rem 0}.card .label{font-size:.8rem;color:#365d52}.contact{display:grid;gap:1rem;max-width:32rem}.contact label{display:grid;gap:.35rem}.contact button{justify-self:start}dt{font-weight:750}dd{margin:0 0 1rem}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}:focus-visible{outline:3px solid #c67b26;outline-offset:3px}

[hidden]{display:none!important}
</style></head>
<body><header class="topbar"><a class="brand" href="index.html">✦ Wayfarer</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="contact.html" aria-current="page">Contact Us</a></nav></header>
<main class="page"><p class="eyebrow">GET IN TOUCH</p><h1>Contact Us</h1><p id="contact-info">The site owner needs to configure a contact address before publication.</p>
<form id="contact" class="contact"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Message<textarea name="message" rows="5" required></textarea></label><button type="submit">Open email draft</button><p id="contact-status" role="status"></p></form></main><script>
// Set a real project contact mailbox before publication.
const contactEmail = '';
const contactForm = document.querySelector('#contact');
const contactStatus = document.querySelector('#contact-status');
if (contactEmail) {
  const link = document.createElement('a');
  link.href = 'mailto:' + contactEmail;
  link.textContent = contactEmail;
  document.querySelector('#contact-info').replaceChildren('Email: ', link);
}
contactForm.addEventListener('submit', event => {
  event.preventDefault();
  if (!contactEmail) {
    contactStatus.textContent = 'The contact email is not configured yet.';
    return;
  }
  const values = new FormData(contactForm);
  const message = values.get('message') + '\n\n' + values.get('name') + ' <' + values.get('email') + '>';
  window.location.href = 'mailto:' + contactEmail + '?subject=' + encodeURIComponent('Wayfarer inquiry') + '&body=' + encodeURIComponent(message);
});

</script>
</body></html>
